<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #141414;
    --bg-2: #1c1c1c;
    --line: #2a2a2a;
    --gold: #c9a96a;
    --gold-soft: #d8c193;
    --text: #ececec;
    --text-dim: #8a8a8a;
    --serif: "Cormorant Garamond", "Noto Serif SC", "Songti SC", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background:
      radial-gradient(circle at 50% -10%, #1f1f1f 0%, var(--bg-0) 55%),
      var(--bg-0);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 56px 44px 40px;
    position: relative;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 40px 80px -40px rgba(0,0,0,0.9);
  }

  /* 顶部细金线 */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .brand {
    text-align: center;
    margin-bottom: 40px;
  }

  .brand .mark {
    font-family: var(--serif);
    font-size: 30px;
    letter-spacing: 6px;
    color: var(--gold-soft);
    font-weight: 500;
  }

  .brand .sub {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .field {
    margin-bottom: 22px;
  }

  .field label {
    display: block;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 9px;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-size: 15px;
    padding: 10px 2px;
    font-family: var(--sans);
    transition: border-color 0.3s ease;
  }

  .field input::placeholder { color: #555; }

  .field input:focus {
    outline: none;
    border-bottom-color: var(--gold);
  }

  .row {
    display: flex;
    justify-content: flex-end;
    margin: -6px 0 28px;
  }

  .forgot {
    font-size: 12.5px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .forgot:hover { color: var(--gold-soft); }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #14110b;
    border: none;
    border-radius: 2px;
    font-size: 14px;
    letter-spacing: 4px;
    font-weight: 500;
    cursor: pointer;
    transition: filter 0.25s ease, transform 0.1s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }

  .foot {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .foot a { color: var(--gold-soft); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">AURELIA</div>
      <div class="sub">Members Login</div>
    </div>

    <form onsubmit="return false;">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" type="text" placeholder="请输入用户名" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
      </div>

      <div class="row">
        <a class="forgot" href="#">忘记密码？</a>
      </div>

      <button class="btn" type="submit">登 录</button>
    </form>

    <div class="foot">还没有账户？<a href="#">立即注册</a></div>
  </main>
</body>
</html>
